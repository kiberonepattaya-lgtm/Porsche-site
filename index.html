<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Porsche's Site — Infinite Void</title>
<script src="https://cdn.tailwindcss.com/3.4.1"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          void: '#000000',
          space: '#050510',
          royal: '#2a0f6b',
          cyan: { neon: '#00E5FF' },
          azure: '#2f7bff',
        },
        fontFamily: {
          display: ['"Orbitron"', '"Segoe UI"', 'sans-serif'],
          body: ['"Rajdhani"', '"Segoe UI"', 'sans-serif'],
        },
      },
    },
  };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html { scroll-behavior: smooth; }
  body {
    background:
      radial-gradient(ellipse at 15% 10%, rgba(42,15,107,.55), transparent 55%),
      radial-gradient(ellipse at 85% 30%, rgba(47,123,255,.18), transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(0,229,255,.12), transparent 60%),
      #050510;
    background-attachment: fixed;
  }
  /* abstract grid receding into the void */
  .void-grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(0,229,255,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,.07) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
  }
  /* rotating geometric glowing border */
  @property --a { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @keyframes spin-a { to { --a: 360deg; } }
  .glow-card { position: relative; border-radius: 14px; isolation: isolate; }
  .glow-card::before {
    content: ''; position: absolute; inset: -1.5px; border-radius: inherit; z-index: -2;
    background: conic-gradient(from var(--a), transparent 0 55%, #00E5FF 72%, #fff 80%, #2f7bff 88%, transparent 100%);
    animation: spin-a 5s linear infinite;
  }
  .glow-card::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit; z-index: -1;
    background: linear-gradient(160deg, rgba(5,5,16,.96), rgba(12,6,40,.94));
  }
  .glow-card { box-shadow: 0 0 30px rgba(0,229,255,.18), 0 0 90px rgba(47,123,255,.12); }
  /* instantaneous space-warp on hover */
  .warp { transition: transform .28s cubic-bezier(.2,.9,.1,1), filter .28s, box-shadow .28s; }
  .warp:hover {
    transform: perspective(700px) scale(1.04) skewX(-2deg) rotateX(3deg);
    filter: drop-shadow(-3px 0 0 rgba(0,229,255,.7)) drop-shadow(3px 0 0 rgba(120,60,255,.7));
    box-shadow: 0 0 50px rgba(0,229,255,.55), 0 0 140px rgba(47,123,255,.4);
  }
  .bloom-text { text-shadow: 0 0 12px rgba(0,229,255,.9), 0 0 40px rgba(0,229,255,.55), 0 0 90px rgba(47,123,255,.5); }
  .eye-ring {
    background: radial-gradient(circle, #fff 0 6%, #00E5FF 12% 22%, #2f7bff 30%, rgba(42,15,107,.6) 55%, transparent 70%);
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.12); opacity: 1; } }
  /* living void: slowly swirling cosmic blues and purples */
  .swirl { position: fixed; inset: -30%; z-index: 0; pointer-events: none; opacity: .85; }
  .swirl-a {
    background: conic-gradient(from 0deg at 40% 45%, rgba(42,15,107,.75), rgba(5,5,16,0) 25%, rgba(47,123,255,.4) 45%, rgba(5,5,16,0) 65%, rgba(0,229,255,.22) 85%, rgba(42,15,107,.75));
    filter: blur(70px); animation: swirl 70s linear infinite;
  }
  .swirl-b {
    background: conic-gradient(from 90deg at 62% 58%, rgba(0,229,255,.18), rgba(5,5,16,0) 30%, rgba(90,40,200,.5) 55%, rgba(5,5,16,0) 80%, rgba(0,229,255,.18));
    filter: blur(90px); animation: swirl 110s linear infinite reverse;
  }
  @keyframes swirl { to { transform: rotate(360deg); } }
  /* intro */
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  .flash.go { animation: flash 900ms ease-out forwards; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
  .reveal { transition: opacity 1.2s ease-out; }
  @media (prefers-reduced-motion: reduce) {
    .swirl-a, .swirl-b { animation: none; }
    .glow-card::before, .eye-ring { animation: none; }
    .warp, html { transition: none; scroll-behavior: auto; }
  }
</style>
</head>
<body class="bg-space text-white font-body antialiased overflow-x-hidden">
<div id="root"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script type="text/babel">
const { useEffect, useRef, useState } = React;

function Starfield() {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current, ctx = c.getContext('2d');
    let w, h, stars, raf;
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const init = () => {
      w = c.width = innerWidth; h = c.height = innerHeight;
      stars = Array.from({ length: Math.min(420, Math.floor(w * h / 4500)) }, () => ({
        x: (Math.random() - .5) * w, y: (Math.random() - .5) * h,
        z: Math.random() * w, hue: Math.random() < .25 ? '0,229,255' : '255,255,255',
      }));
    };
    const draw = () => {
      ctx.clearRect(0, 0, w, h);
      for (const s of stars) {
        if (!reduce) s.z -= 1.2;
        if (s.z < 1) s.z = w;
        const k = 128 / s.z * 4;
        const x = s.x * k + w / 2, y = s.y * k + h / 2;
        if (x < 0 || x > w || y < 0 || y > h) { s.z = w; continue; }
        const r = Math.max(.2, (1 - s.z / w) * 2.2);
        ctx.fillStyle = `rgba(${s.hue},${0.3 + (1 - s.z / w) * .7})`;
        ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
      }
      raf = requestAnimationFrame(draw);
    };
    init(); draw();
    addEventListener('resize', init);
    return () => { cancelAnimationFrame(raf); removeEventListener('resize', init); };
  }, []);
  return <canvas ref={ref} className="fixed inset-0 z-0 pointer-events-none" aria-hidden="true" />;
}

// Cyan particles that drift across the screen forever
function Drift() {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current, ctx = c.getContext('2d');
    let w, h, ps, raf;
    const init = () => {
      w = c.width = innerWidth; h = c.height = innerHeight;
      ps = Array.from({ length: Math.floor(w * h / 14000) }, () => ({
        x: Math.random() * w, y: Math.random() * h, r: .6 + Math.random() * 1.8,
        vx: .08 + Math.random() * .35, vy: (Math.random() - .5) * .18, ph: Math.random() * 6.28,
      }));
    };
    const draw = (t) => {
      ctx.clearRect(0, 0, w, h);
      for (const p of ps) {
        p.x += p.vx; p.y += p.vy + Math.sin(t / 2000 + p.ph) * .12;
        if (p.x > w + 10) p.x = -10;
        if (p.y > h + 10) p.y = -10;
        if (p.y < -10) p.y = h + 10;
        const a = .35 + .45 * Math.sin(t / 900 + p.ph);
        ctx.shadowColor = '#00E5FF'; ctx.shadowBlur = 10;
        ctx.fillStyle = `rgba(0,229,255,${Math.max(.1, a)})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
      }
      raf = requestAnimationFrame(draw);
    };
    init(); raf = requestAnimationFrame(draw);
    addEventListener('resize', init);
    return () => { cancelAnimationFrame(raf); removeEventListener('resize', init); };
  }, []);
  return <canvas ref={ref} className="fixed inset-0 z-0 pointer-events-none" aria-hidden="true" />;
}

// Domain Expansion intro: black -> flash -> ripple -> information overload -> fade out
const T = { flash: 700, overload: 1000, fade: 3800, end: 4800 };
function Intro({ onReveal, onDone }) {
  const cv = useRef(null);
  const [go, setGo] = useState(false);
  const [fading, setFading] = useState(false);
  useEffect(() => {
    const c = cv.current, ctx = c.getContext('2d');
    const w = c.width = innerWidth, h = c.height = innerHeight, cx = w / 2, cy = h / 2;
    const reach = Math.hypot(cx, cy) * 1.2;
    const glyphs = 'ア イ ウ エ オ カ キ ク ケ コ サ シ ス セ ソ 無 量 空 処 領 域 展 開 呪 術 廻 戦 0 1 ∞ ∑ ∆ Ω ◇ ◆ ⌬ ⍟'.split(' ');
    const rg = () => glyphs[Math.random() * glyphs.length | 0];
    const fs = 18, cols = Math.ceil(w / fs), drops = Array.from({ length: cols }, () => Math.random() * -50);
    const floaters = Array.from({ length: 60 }, () => ({
      x: Math.random() * w, y: Math.random() * h, g: rg(),
      s: 18 + Math.random() * 60, v: .5 + Math.random() * 3, ph: Math.random() * 6.28,
    }));
    const start = performance.now();
    let raf, flashed = false, fadeSet = false;
    const draw = (now) => {
      const t = now - start;
      if (t >= T.flash && !flashed) { flashed = true; setGo(true); }
      if (t >= T.fade && !fadeSet) { fadeSet = true; setFading(true); onReveal(); }
      if (t >= T.end) return onDone();
      ctx.fillStyle = 'rgba(0,0,0,' + (t < T.overload ? 1 : .22) + ')';
      ctx.fillRect(0, 0, w, h);
      // explosive ripples from the centre
      if (t >= T.flash) {
        for (let i = 0; i < 5; i++) {
          const r = (t - T.flash - i * 130) * 1.7;
          if (r > 0 && r < reach) {
            ctx.strokeStyle = `rgba(${i % 2 ? '0,229,255' : '255,255,255'},${1 - r / reach})`;
            ctx.lineWidth = 6 - i; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.283); ctx.stroke();
          }
        }
      }
      if (t >= T.overload && t < T.fade + 400) {
        const k = Math.min(1, (t - T.overload) / 600); // overload ramps up
        const zoom = ((t - T.overload) / 700) % 1;
        // zooming geometric grid
        ctx.lineWidth = 1.2;
        for (let i = 0; i < 9; i++) {
          const s = Math.pow((i + zoom) / 9, 2.2), ww = s * w * 1.6, hh = s * h * 1.6;
          ctx.strokeStyle = `rgba(0,229,255,${.12 + s * .55 * k})`;
          ctx.strokeRect(cx - ww / 2, cy - hh / 2, ww, hh);
          ctx.beginPath();
          ctx.moveTo(cx, cy); ctx.lineTo(cx - ww / 2, cy - hh / 2);
          ctx.moveTo(cx, cy); ctx.lineTo(cx + ww / 2, cy + hh / 2);
          ctx.moveTo(cx, cy); ctx.lineTo(cx + ww / 2, cy - hh / 2);
          ctx.moveTo(cx, cy); ctx.lineTo(cx - ww / 2, cy + hh / 2);
          ctx.stroke();
        }
        // fast matrix code
        ctx.font = fs + 'px monospace';
        for (let i = 0; i < cols; i++) {
          const y = drops[i] * fs;
          ctx.fillStyle = '#fff'; ctx.fillText(rg(), i * fs, y);
          ctx.fillStyle = `rgba(0,229,255,${.8 * k})`; ctx.fillText(rg(), i * fs, y - fs);
          drops[i] += 1.6 + (i % 5) * .5;
          if (y > h && Math.random() > .96) drops[i] = Math.random() * -20;
        }
        // floating glyphs
        for (const f of floaters) {
          f.y -= f.v; f.x += Math.sin(now / 400 + f.ph) * 1.2;
          if (f.y < -80) f.y = h + 80;
          ctx.font = f.s + 'px monospace';
          ctx.fillStyle = `rgba(${f.s > 50 ? '160,110,255' : '255,255,255'},${.25 + .5 * k})`;
          ctx.fillText(f.g, f.x, f.y);
        }
      }
      raf = requestAnimationFrame(draw);
    };
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
    raf = requestAnimationFrame(draw);
    return () => cancelAnimationFrame(raf);
  }, []);
  return (
    <div onClick={() => { onReveal(); onDone(); }} className="fixed inset-0 z-50 bg-black cursor-pointer" style={{ opacity: fading ? 0 : 1, transition: 'opacity 1000ms ease-in', pointerEvents: fading ? 'none' : 'auto' }} role="presentation" aria-hidden="true">
      <canvas ref={cv} className="absolute inset-0" />
      <div className={'flash ' + (go ? 'go' : '')} />
    </div>
  );
}

function Header() {
  const links = ['about', 'hobbies', 'contact'];
  return (
    <header className="sticky top-0 z-20 flex items-center justify-between px-6 md:px-12 py-4 backdrop-blur-md bg-void/60 border-b border-cyan-neon/30 shadow-[0_0_30px_rgba(0,229,255,.2)]">
      <div className="font-display font-bold tracking-[.3em] text-cyan-neon bloom-text">PORSCHE</div>
      <nav>
        <ul className="flex gap-6 md:gap-10 font-display text-xs md:text-sm tracking-widest uppercase">
          {links.map(l => (
            <li key={l}><a href={'#' + l} className="text-white/80 hover:text-cyan-neon transition-colors duration-150 hover:[text-shadow:0_0_14px_#00E5FF]">{l}</a></li>
          ))}
        </ul>
      </nav>
    </header>
  );
}

function Hero() {
  const [msg, setMsg] = useState('');
  return (
    <section id="hero" className="relative z-10 min-h-[88vh] flex flex-col items-center justify-center text-center px-6 py-24">
      <div className="absolute w-[560px] h-[560px] max-w-[95vw] max-h-[95vw] rounded-full eye-ring opacity-60 blur-[2px] -z-10" aria-hidden="true" />
      <p className="font-display text-xs md:text-sm tracking-[.5em] text-azure uppercase mb-6">Domain Expansion · Infinite Void</p>
      <h1 className="font-display font-black text-5xl md:text-8xl leading-tight text-white bloom-text">Porsche's Site</h1>
      <p className="mt-8 max-w-2xl text-lg md:text-xl text-white/85 leading-relaxed">
        My favorite hobby is editing — bringing photos and videos to life with color, cuts, and effects.
      </p>
      <button
        onClick={() => setMsg('Welcome, PAWN! To my website!.')}
        className="warp mt-10 px-10 py-3 font-display font-bold tracking-[.25em] uppercase text-void bg-cyan-neon rounded-md shadow-[0_0_30px_rgba(0,229,255,.7)]"
      >Hello</button>
      <p className="mt-6 h-7 font-display text-cyan-neon bloom-text" aria-live="polite">{msg}</p>
    </section>
  );
}

function Card({ id, title, children }) {
  return (
    <section id={id} className="relative z-10 px-6 py-12 scroll-mt-24">
      <div className="glow-card warp max-w-3xl mx-auto p-8 md:p-12 text-left">
        <h2 className="font-display font-bold text-2xl md:text-3xl tracking-widest uppercase text-cyan-neon bloom-text mb-5">{title}</h2>
        <p className="text-lg md:text-xl leading-relaxed text-white/90">{children}</p>
      </div>
    </section>
  );
}

function App() {
  const skip = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const [intro, setIntro] = useState(!skip);
  const [shown, setShown] = useState(skip);
  return (
    <>
      <div className="swirl swirl-a" aria-hidden="true" />
      <div className="swirl swirl-b" aria-hidden="true" />
      <div className="void-grid" aria-hidden="true" />
      <Starfield />
      <Drift />
      {intro && <Intro onReveal={() => setShown(true)} onDone={() => setIntro(false)} />}
      <div className="reveal" style={{ opacity: shown ? 1 : 0 }}>
      <Header />
      <main>
        <Hero />
        <Card id="about" title="About Me">
          I'm Porsche, someone who loves creating and building things online. I enjoy learning new skills and finding creative ways to bring ideas to life.
        </Card>
        <Card id="hobbies" title="My Hobbies">
          Editing is my favorite way to be creative, turning raw photos and videos into something people enjoy watching. I love experimenting with color grading, smooth cuts, transitions, and visual effects. Every project teaches me something new, and I'm always looking for fresh techniques to improve my craft.
        </Card>
        <Card id="contact" title="Contact">
          Want to get in touch? Feel free to reach out with any questions or just to say hello. I'm always happy to connect with new people.
        </Card>
      </main>
      <footer className="relative z-10 text-center py-12 font-display text-xs tracking-[.4em] uppercase text-white/60">Made by Porsche</footer>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
