<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Porsche's Gojo Codex</title>
<script src="https://cdn.tailwindcss.com/3.4.1"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          void: 'var(--c-bg)',
          white: 'rgb(var(--c-text) / <alpha-value>)',
          indigo9: '#07041c',
          violet9: '#1a0b4a',
          cyan: { neon: 'rgb(var(--c-accent) / <alpha-value>)' },
          azure: 'rgb(var(--c-accent2) / <alpha-value>)',
          crimson: 'rgb(var(--c-danger) / <alpha-value>)',
          hollow: 'rgb(var(--c-hollow) / <alpha-value>)',
        },
        fontFamily: {
          display: ['var(--font-display)'],
          body: ['var(--font-body)'],
        },
      },
    },
  };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600&family=Noto+Sans+JP:wght@500;700&family=Cinzel:wght@500;700;900&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* ── theme variables: Gojo defaults, Sukuna overrides (RGB triplets so Tailwind /opacity works) ── */
  :root {
    --c-bg: #000000;
    --c-accent: 0 229 255;
    --c-accent2: 47 123 255;
    --c-hollow: 181 140 255;
    --c-danger: 255 59 92;
    --c-text: 255 255 255;
    --font-display: "Orbitron", "Segoe UI", sans-serif;
    --font-body: "Rajdhani", "Noto Sans JP", "Segoe UI", sans-serif;
    --card-a: rgba(4,2,16,.94); --card-b: rgba(14,7,46,.92);
    --bg-1: rgba(26,11,74,.55); --bg-2: rgba(47,20,130,.45); --bg-3: rgba(7,4,28,.9);
    --sw-1: rgba(60,20,160,.55); --sw-2: rgba(20,20,120,.5); --sw-3: rgba(100,40,200,.35); --sw-4: rgba(80,30,190,.4);
  }
  body.sukuna-mode {
    --c-bg: #0d0204;
    --c-accent: 255 0 60;      /* blood crimson */
    --c-accent2: 255 170 0;    /* eye-gold */
    --c-hollow: 255 120 0;     /* Fuga flame */
    --c-danger: 255 0 60;
    --c-text: 234 230 223;     /* bone white */
    --font-display: "Cinzel", "Noto Serif JP", serif;
    --font-body: "Noto Serif JP", "Cinzel", serif;
    --card-a: rgba(13,2,4,.95); --card-b: rgba(40,4,10,.92);
    --bg-1: rgba(90,0,20,.5); --bg-2: rgba(60,0,10,.45); --bg-3: rgba(20,0,4,.9);
    --sw-1: rgba(120,0,25,.5); --sw-2: rgba(70,0,12,.5); --sw-3: rgba(160,60,0,.3); --sw-4: rgba(130,0,30,.4);
  }
  html { scroll-behavior: smooth; }
  body { background: var(--c-bg); transition: background .6s; }
  .bg-fixed {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 50%, var(--bg-1), transparent 60%),
      radial-gradient(ellipse at 10% 0%, var(--bg-2), transparent 55%),
      radial-gradient(ellipse at 90% 100%, var(--bg-3), transparent 60%),
      var(--c-bg);
  }
  /* slow swirl of violet / indigo behind the grid */
  .swirl { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .swirl-a {
    background: conic-gradient(from 0deg at 50% 50%, var(--sw-1), rgba(0,0,0,0) 22%, var(--sw-2) 45%, rgba(0,0,0,0) 68%, var(--sw-3) 86%, var(--sw-1));
    
  }
  .swirl-b {
    background: conic-gradient(from 120deg at 45% 55%, rgb(var(--c-accent) / .10), rgba(0,0,0,0) 30%, var(--sw-4) 60%, rgba(0,0,0,0) 85%, rgb(var(--c-accent) / .10));
  }
  @keyframes swirl { to { transform: rotate(360deg); } }
  /* vignette: the void presses in from the edges */
  .vignette { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.75) 100%); }

  .glow-card { position: relative; border-radius: 6px; isolation: isolate; clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px)); }
  .glow-card::before {
    content: ''; position: absolute; inset: -60%; z-index: -2;
    background: conic-gradient(from 0deg, transparent 0 55%, rgb(var(--c-accent)) 72%, rgb(var(--c-text)) 80%, rgb(var(--c-accent2)) 88%, transparent 100%);
  }
  .glow-wrap:hover .glow-card::before { animation: swirl 3s linear infinite; }
  .glow-card::after {
    content: ''; position: absolute; inset: 1.5px; z-index: -1;
    clip-path: inherit;
    background: linear-gradient(160deg, var(--card-a), var(--card-b));
  }
  .glow-wrap { box-shadow: 0 0 24px rgb(var(--c-accent) / .16); transition: transform .25s cubic-bezier(.2,.9,.1,1), box-shadow .25s; }
  .glow-wrap:hover { transform: scale(1.02); box-shadow: 0 0 48px rgb(var(--c-accent) / .45); }
  .bloom-text { text-shadow: 0 0 10px rgb(var(--c-accent) / .9), 0 0 36px rgb(var(--c-accent) / .5), 0 0 80px rgb(var(--c-accent2) / .45); }
  .tab-on { background: rgb(var(--c-accent) / .14); box-shadow: inset 0 0 0 1px currentColor, 0 0 24px currentColor; }
  .reveal { transition: opacity 1.4s ease-out; }
  .meter { transition: width 1.6s cubic-bezier(.2,.8,.2,1); }
  .scan::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: rgb(var(--c-accent) / .7); box-shadow: 0 0 12px rgb(var(--c-accent)); will-change: transform; animation: scan 3.5s linear infinite; }
  @keyframes scan { 0% { transform: translateY(0); } 100% { transform: translateY(320px); } }
  .iris-spin { animation: swirl 40s linear infinite; transform-origin: center; }
  /* ── hidden event: Hollow Purple + boss fight ── */
  .shred {
    --p: -50;
    -webkit-mask-image: linear-gradient(90deg, transparent calc(var(--p) * 1%), #000 calc(var(--p) * 1% + 4%));
    mask-image: linear-gradient(90deg, transparent calc(var(--p) * 1%), #000 calc(var(--p) * 1% + 4%));
  }
  .shaking { animation: shakeScreen .12s linear infinite; }
  @keyframes shakeScreen { 0%{transform:translate(0,0)} 25%{transform:translate(-7px,4px)} 50%{transform:translate(6px,-6px)} 75%{transform:translate(-5px,-3px)} 100%{transform:translate(0,0)} }
  @keyframes orbIn { from{transform:rotate(var(--a)) translateX(56px) scale(1);opacity:0} 25%{opacity:1} to{transform:rotate(var(--a)) translateX(0) scale(.2);opacity:0} }
  @keyframes orbOut { from{transform:rotate(var(--a)) translateX(6px) scale(.4);opacity:1} to{transform:rotate(var(--a)) translateX(60px) scale(1.1);opacity:0} }
  @keyframes shardFly { 0%{opacity:0;transform:translate(0,0) rotate(0)} 8%{opacity:1} 100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot))} }
  @keyframes tpStrike { 0%{transform:translate(0,0) scale(1);opacity:1} 15%{opacity:0} 30%{transform:translate(0,230px) scale(1.5);opacity:1} 60%{transform:translate(0,230px) scale(1.5);opacity:1} 72%{opacity:0} 100%{transform:translate(0,0) scale(1);opacity:1} }
  @keyframes pullStage { 0%{transform:none} 35%{transform:scale(.82,1.15) skew(9deg,4deg)} 65%{transform:scale(.7,1.3) skew(-6deg,-3deg)} 100%{transform:none} }
  @keyframes vortexMenu { 0%{transform:none;opacity:1} 40%,65%{transform:translateY(-340px) scale(.25) rotate(540deg);opacity:.4} 100%{transform:none;opacity:1} }
  @keyframes repelStage { 0%{transform:none} 14%{transform:scale(1.1) translateX(70px) skewX(-6deg)} 100%{transform:none} }
  @keyframes floatUp { 0%{opacity:0;transform:translate(-50%,0)} 15%{opacity:1} 100%{opacity:0;transform:translate(-50%,-90px)} }
  @keyframes flashOut { 0%{opacity:1} 100%{opacity:0} }
  @keyframes beam { 0%{transform:scaleX(0);opacity:1} 40%{transform:scaleX(1);opacity:1} 100%{transform:scaleX(1);opacity:0} }
  @keyframes frostIn { from{opacity:0} to{opacity:1} }
  @keyframes doubleVision {
    0%, 100% { filter: drop-shadow(-4px 0 0 rgba(255,40,80,.55)) drop-shadow(4px 0 0 rgba(0,200,255,.55)); transform: translateX(0); }
    50% { filter: drop-shadow(-9px 1px 0 rgba(255,40,80,.5)) drop-shadow(9px -1px 0 rgba(0,200,255,.5)); transform: translateX(2px); }
  }
  .frost { background: linear-gradient(135deg, rgba(255,255,255,.35), rgba(190,230,255,.18) 40%, rgba(255,255,255,.4)), repeating-linear-gradient(60deg, rgba(255,255,255,.12) 0 2px, transparent 2px 18px), repeating-linear-gradient(-30deg, rgba(255,255,255,.1) 0 1px, transparent 1px 26px);  }
  /* ── Sukuna mode: blade-cut shapes, takeover shake + vignette flash ── */
  body.sukuna-mode .glow-card { clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 14px, 100% 100%, 8px 100%, 0 calc(100% - 10px)); border-radius: 0; }
  body.sukuna-mode button:not(#sukuna-finger),
  body.sukuna-mode [role="tab"] { border-radius: 0; border-style: dashed; clip-path: polygon(0 0, 95% 0, 100% 22%, 100% 100%, 4% 100%, 0 78%); }
  body.sukuna-mode .rounded, body.sukuna-mode .rounded-sm, body.sukuna-mode .rounded-full { border-radius: 0 !important; }
  body.sukuna-mode h1, body.sukuna-mode h2, body.sukuna-mode h3 { font-weight: 900; letter-spacing: .08em; }
  body.sukuna-mode .vignette { background: radial-gradient(ellipse at center, transparent 30%, rgba(60,0,10,.85) 100%); }
  @keyframes skShake {
    0%,100% { transform: translate(0,0) }
    10% { transform: translate(-12px,6px) rotate(-.6deg) }
    30% { transform: translate(10px,-8px) rotate(.5deg) }
    50% { transform: translate(-8px,-4px) }
    70% { transform: translate(6px,8px) rotate(.3deg) }
    90% { transform: translate(-3px,2px) }
  }
  @keyframes skVignette { 0% { opacity: 0 } 25% { opacity: 1 } 100% { opacity: 0 } }
  /* ── Fūga screen-nuke: 1) chant + dark + shake  2) the arrow forms and vibrates  3) after 1.5 s it fires → white flash → volcanic firestorm → fade ── */
  .fuga-overlay { position: fixed; inset: 0; z-index: 10000; pointer-events: none; overflow: hidden; }
  .fuga-dark { position: absolute; inset: 0; opacity: 0; background: radial-gradient(circle at 50% 50%, rgba(20,0,4,.92), #000 92%); animation: fugaDarkIn .12s ease-out forwards; }
  .fuga-text { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); white-space: nowrap; font-family: var(--font-display); font-weight: 900;
    font-size: clamp(3rem, 12vw, 9rem); letter-spacing: .12em; color: #ffaa00; text-shadow: 0 0 20px #ff003c, 0 0 60px #ff7800, 0 0 120px #ff003c;
    animation: fugaPop .45s cubic-bezier(.2,1.6,.4,1) both, fugaFlicker .14s steps(2) .45s infinite; }
  .fuga-text small { display: block; text-align: center; font-size: .22em; letter-spacing: .5em; color: #eae6df; text-shadow: 0 0 12px #ff003c; }
  .fuga-overlay.fired .fuga-text { animation: none; opacity: 0; }
  .fuga-arrow { position: absolute; left: 10vw; top: 66%; width: 48vw; height: 6vw; min-height: 36px; max-height: 80px; opacity: 0; transform: scaleX(0); transform-origin: left center;
    background: linear-gradient(90deg, rgba(255,0,60,0), rgba(255,0,60,.8) 30%, #ff7800 65%, #ffd34d 88%, #fff 100%);
    clip-path: polygon(0 35%, 88% 35%, 88% 0, 100% 50%, 88% 100%, 88% 65%, 0 65%); filter: drop-shadow(0 0 18px #ff7800) drop-shadow(0 0 50px #ff003c); }
  .fuga-overlay.arrow-on .fuga-arrow { opacity: 1; animation: fugaForm .5s ease-out forwards, fugaVibrate .05s linear .5s infinite; }
  .fuga-overlay.fired .fuga-arrow { opacity: 1; animation: fugaFire .35s cubic-bezier(.6,0,1,1) forwards; }
  .fuga-flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  .fuga-storm { position: absolute; inset: 0; opacity: 0; background: radial-gradient(circle at 72% 62%, #fff 0, #ffd34d 10%, #ff7800 28%, #ff003c 48%, #3a0008 75%, #0d0204 100%); }
  .fuga-storm::after { content: ''; position: absolute; inset: 0; background-image: radial-gradient(circle, #ffd34d 0 2px, transparent 3px), radial-gradient(circle, #ff7800 0 3px, transparent 4px);
    background-size: 70px 90px, 110px 130px; animation: fugaEmbers 1.6s linear forwards; }
  .fuga-overlay.impact .fuga-dark { animation: fugaDarkOut 1.65s ease-out forwards; }
  .fuga-overlay.impact .fuga-flash { animation: fugaWhite 1.2s ease-out forwards; }
  .fuga-overlay.impact .fuga-storm { animation: fugaStorm 1.65s ease-out forwards; }
  body.fuga-shaking #root { animation: fugaShake .07s linear infinite; }
  @keyframes fugaDarkIn { to { opacity: 1 } }
  @keyframes fugaDarkOut { from { opacity: 1 } to { opacity: 0 } }
  @keyframes fugaPop { from { transform: translate(-50%, -50%) scale(2.6); opacity: 0 } to { transform: translate(-50%, -50%) scale(1); opacity: 1 } }
  @keyframes fugaFlicker { 0% { opacity: 1 } 100% { opacity: .55 } }
  @keyframes fugaForm { to { transform: scaleX(1) } }
  @keyframes fugaVibrate { 0% { translate: 0 0 } 25% { translate: -4px 3px } 50% { translate: 3px -3px } 75% { translate: -3px -2px } 100% { translate: 0 0 } }
  @keyframes fugaFire { from { transform: scaleX(1) } to { transform: translateX(115vw) scaleX(1.4) } }
  @keyframes fugaWhite { 0%, 35% { opacity: 1 } 100% { opacity: 0 } }
  @keyframes fugaStorm { 0% { opacity: 0; transform: scale(.55) } 20% { opacity: 1; transform: scale(1.05) } 60% { opacity: 1; transform: scale(1.25) } 100% { opacity: 0; transform: scale(1.5) } }
  @keyframes fugaEmbers { from { background-position: 0 0, 0 0 } to { background-position: 0 -520px, 0 -760px } }
  @keyframes fugaShake { 0% { transform: translate(0,0) } 20% { transform: translate(-16px,9px) rotate(-.5deg) } 40% { transform: translate(14px,-12px) rotate(.4deg) } 60% { transform: translate(-12px,-8px) } 80% { transform: translate(11px,10px) rotate(.3deg) } 100% { transform: translate(0,0) } }
  /* ── Malevolent Shrine: a temple of skulls and ribs rises from a blood-red sea ── */
  .sh-rise { animation: shrineRise 1.1s cubic-bezier(.2,.8,.2,1) both; }
  .sh-rib { animation: shrineRise .8s ease-out both; }
  .sh-pop { animation: skullPop .45s cubic-bezier(.2,1.6,.4,1) both; transform-box: fill-box; transform-origin: center; }
  .sh-ember { animation: emberUp 3s linear infinite; }
  @keyframes shrineLife { 0% { opacity: 0 } 8% { opacity: 1 } 88% { opacity: 1 } 100% { opacity: 0 } }
  @keyframes shrineRise { from { transform: translateY(40px); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes skullPop { from { transform: scale(0) } 70% { transform: scale(1.35) } to { transform: scale(1) } }
  @keyframes emberUp { from { transform: translateY(0); opacity: 0 } 15% { opacity: 1 } to { transform: translateY(-55px); opacity: 0 } }
  @keyframes shrineSlash { 0%, 100% { opacity: 0 } 6% { opacity: 1 } 16% { opacity: 0 } }
  @keyframes shrineTitle { 0% { opacity: 0; transform: scale(1.4) } 12% { opacity: 1; transform: scale(1) } 85% { opacity: 1 } 100% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { body.fuga-shaking #root, .sh-rise, .sh-rib, .sh-pop, .sh-ember { animation: none; } }
  /* Sukuna moves: Cleave (crisscross cuts), Dismantle (air slash), Fuga (fire arrow) */
  @keyframes slashDraw { from { stroke-dashoffset: 1 } to { stroke-dashoffset: 0 } }
  @keyframes slashFade { 0%, 65% { opacity: 1 } 100% { opacity: 0 } }
  @keyframes cutLine { 0% { opacity: 0; transform: rotate(-16deg) scaleX(0) } 35% { opacity: 1; transform: rotate(-16deg) scaleX(1) } 100% { opacity: 0; transform: rotate(-16deg) scaleX(1) } }
  body.sk-shaking #root { animation: skShake .7s ease-in-out; }
  #sk-vignette { position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0;
    background: radial-gradient(circle, transparent 20%, rgba(255,0,60,.85) 70%, #000 100%); }
  #sk-vignette.on { animation: skVignette 1.1s ease-out; }
  @media (prefers-reduced-motion: reduce) {
    .shaking { animation: none; }
    body.sk-shaking #root, #sk-vignette.on { animation: none; }
    .swirl-a, .swirl-b, .glow-card::before, .iris-spin, .scan::after { animation: none; }
    .glow-wrap, html { transition: none; scroll-behavior: auto; }
  }
</style>
</head>
<body class="bg-void text-white font-body antialiased overflow-x-hidden">
<div id="root"></div>
<div id="sk-vignette" aria-hidden="true"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script type="text/babel">
const { useEffect, useRef, useState, useMemo } = React;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ───────────── Sukuna mode: theme toggle + text dictionary ───────────── */
const SukunaMode = (() => {
  const body = document.body, vignette = document.getElementById('sk-vignette'), subs = new Set();
  const isOn = () => body.classList.contains('sukuna-mode');
  const toggle = () => {
    const next = !isOn();
    body.classList.add('sk-shaking');
    vignette.classList.remove('on'); void vignette.offsetWidth; vignette.classList.add('on');
    // swap at the peak of the flash so the change is hidden by it
    setTimeout(() => { body.classList.toggle('sukuna-mode', next); subs.forEach(fn => fn(next)); }, REDUCED ? 0 : 250);
    setTimeout(() => body.classList.remove('sk-shaking'), 750);
  };
  return { isOn, toggle, subscribe: (fn) => { subs.add(fn); return () => subs.delete(fn); } };
})();
document.addEventListener('click', (e) => { if (e.target.closest('#sukuna-finger')) SukunaMode.toggle(); });

const THEME_TEXT = {
  'GOJO · CODEX': 'SUKUNA · CODEX', 'Satoru': 'Ryomen', 'Gojo': 'Sukuna',
  'The Strongest': 'King of Curses', 'Six Eyes': 'Four Eyes', 'Limitless': 'Shrine',
  'Domain': 'Malevolent Shrine', 'Blue': 'Cleave', 'Red': 'Dismantle', 'Purple': 'Fuga',
  'Hollow Purple': 'Fuga', 'Unlimited Void': 'Malevolent Shrine', 'Infinite Void': 'Malevolent Shrine',
  'Blue (attract)': 'Cleave (shred)', 'Red (repel)': 'Dismantle (cut)', 'Purple (erase)': 'Fuga (open)',
  'Infinite Void · 無量空処': 'Malevolent Shrine · 伏魔御廚子',
  'Limitless Paradox Matrix': 'Slaughter Technique Matrix', 'Domain Absolute State': 'Malevolent Shrine State',
  '五条悟 · The Strongest': '両面宿儺 · King of Curses',
  'Attraction · Convergence': 'Touch · Crisscross cuts', 'Repulsion · Reversed Output': 'Ranged · Air slash',
  'Annihilation · Imaginary Mass': 'Divine Flame · “Open”',
  '蒼 · Cursed Technique Lapse': '捌 · Cleave', '赫 · Cursed Technique Reversal': '解 · Dismantle', '茈 · Hollow Technique': '竈 · Fuga',
};
const SK_EYES = [
  { k: 'Cursed-energy output', v: 100, note: 'Overwhelming reserves — the King of Curses fights at full strength without strain.' },
  { k: 'Slash precision', v: 98, note: 'Cleave adjusts to the toughness of its target; Dismantle cuts anything it touches.' },
  { k: 'Combat instinct', v: 99, note: 'A thousand years of battle. He reads an opponent and answers before the move finishes.' },
  { k: 'Technique versatility', v: 95, note: 'Slashes, Divine Flame, reverse cursed technique and domain, all used at will.' },
];
const SK_STEPS = [
  { t: 0, label: 'Seal', text: 'The sign is formed. His cursed energy surges outward.' },
  { t: 50, label: 'Rise', text: 'The Shrine rises: a temple of skulls and ribs, with no barrier around it.' },
  { t: 100, label: 'Slash', text: 'Cleave and Dismantle begin to rain on everything inside.' },
  { t: 200, label: 'Sure-hit', text: 'Every slash lands. Everything in range is carved apart.' },
];
const THEME_SK = {
  infinity: { name: 'Reverse Cursed Technique', jp: '反転術式 · Hanten', tag: 'Passive · Regeneration',
    body: 'Sukuna heals wounds mid-fight with reverse cursed technique, shrugging off damage that would end any other sorcerer. Where others must avoid every blow, he simply keeps fighting.',
    facts: ['Positive cursed energy repairs the body', 'Recovers from wounds during battle', 'Lets him fight on through heavy damage'] },
  blue: { facts: ['Overlapping cuts that adapt to the target’s toughness', 'Usually needs physical contact', 'Bursts into criss-crossing red-and-black cuts at once'] },
  red: { facts: ['Invisible blade — only a ripple in the air', 'Flies outward in fast, sweeping lines', 'Slices clean through objects in a single cut'] },
  purple: { facts: ['Archer’s pose: a bowstring drawn from fire', 'Fire arrow at supersonic speed, trailing scorching heat', 'Ends in a colossal, apocalyptic firestorm'] },
};
const THEME_BODY = {
  blue: 'Cleave is a brutal mesh of overlapping cuts that adapts to the toughness of its target. Sukuna usually has to touch what he cleaves — and when he does, it bursts into criss-crossing butcher cuts all at once.',
  red: 'Dismantle is an invisible, flying blade of cursed energy — just a ripple in the air, laced with crimson. It sweeps outward in fast lines and slices clean through buildings and people in a single cut.',
  purple: 'Fuga is a Divine Flame. Sukuna poses like an archer and draws back a bowstring of fire; released with the word “Open”, the plasma arrow flies at supersonic speed and ends in a colossal firestorm.',
};
function useSukuna() {
  const [on, setOn] = useState(SukunaMode.isOn());
  useEffect(() => SukunaMode.subscribe(setOn), []);
  return [on, (s) => (on && THEME_TEXT[s]) || s];
}

/* ───────────────────────── shared lexicon ───────────────────────── */
const EQS = ['∞', 'lim x→∞', '∇·B = 0', 'Σ 1/n² = π²/6', '∫ e^{-x²}dx', 'e^{iπ}+1=0', 'dx/dt → 0', '1/2 + 1/4 + 1/8 …', 'Δx → 0', 'ψ(r,t)', 'F = −∇U', 'ℵ₀', '∮ E·dA', 'lim n→∞ (1−2⁻ⁿ)', 'det(A−λI)=0', 'ħ ∂ψ/∂t'];
const LEX = ['無量空処', '領域展開', '六眼', '無下限呪術', '蒼', '赫', '茈', '五条悟', 'MUKAGEN', 'LAPSE', 'REVERSAL', 'HOLLOW', 'SIX EYES', 'LIMITLESS', 'INFINITE VOID', 'MURYŌKŪSHO', 'SEE EVERYTHING', 'CANNOT MOVE', 'INPUT ∞', 'STIMULUS FLOOD', 'THOUGHT COPY ×∞', 'CURSED ENERGY', 'PERCEPTION OVERLOAD', ...EQS, '0110 1110', '0xFF00AA', 'ERROR', 'SATORU', 'THE STRONGEST'];
const pick = (a) => a[Math.random() * a.length | 0];

/* ───────────────────── Domain Expansion intro ───────────────────── */
// black → white flash → blue concentric "eye" → fracturing space + chaotic text → freeze → shatter
const T = { flash: 600, eye: 700, chaos: 1500, freeze: 3700, shatter: 4200, end: 5300 };

function Intro({ onReveal, onDone }) {
  const cv = useRef(null);
  useEffect(() => {
    const c = cv.current, ctx = c.getContext('2d');
    const w = c.width = innerWidth, h = c.height = innerHeight, cx = w / 2, cy = h / 2;
    const maxR = Math.hypot(cx, cy);
    const snap = document.createElement('canvas'); snap.width = w; snap.height = h;
    const sctx = snap.getContext('2d');

    // overlapping chaotic strings
    const strings = Array.from({ length: 70 }, () => ({
      x: Math.random() * w, y: Math.random() * h, s: 10 + Math.pow(Math.random(), 2.2) * 110,
      rot: (Math.random() - .5) * 1.2, txt: pick(LEX), life: 0,
      col: pick(['#ffffff', '#ffffff', '#00E5FF', '#2f7bff', '#b58cff']), born: 1500 + Math.random() * 1400,
    }));
    // space fractures: persistent jagged cracks from the centre
    const cracks = [];
    const makeCrack = () => {
      let a = Math.random() * 6.283, x = cx, y = cy, pts = [[x, y]];
      const segs = 6 + (Math.random() * 10 | 0);
      for (let i = 0; i < segs; i++) {
        a += (Math.random() - .5) * 1.1; const l = 40 + Math.random() * maxR / 5;
        x += Math.cos(a) * l; y += Math.sin(a) * l; pts.push([x, y]);
      }
      return { pts, w: .6 + Math.random() * 2, col: Math.random() < .6 ? '#00E5FF' : '#ffffff', at: 0 };
    };
    // shatter shards (2 triangles per cell)
    const COLS = 10, ROWS = 6, shards = [];
    const cw = w / COLS, ch = h / ROWS;
    for (let i = 0; i < COLS; i++) for (let j = 0; j < ROWS; j++) {
      const x0 = i * cw, y0 = j * ch;
      [[[x0, y0], [x0 + cw, y0], [x0, y0 + ch]], [[x0 + cw, y0], [x0 + cw, y0 + ch], [x0, y0 + ch]]].forEach(tri => {
        const mx = (tri[0][0] + tri[1][0] + tri[2][0]) / 3, my = (tri[0][1] + tri[1][1] + tri[2][1]) / 3;
        const dx = mx - cx, dy = my - cy, d = Math.hypot(dx, dy) || 1;
        const sp = .6 + Math.random() * 1.4;
        shards.push({ tri, mx, my, bx: x0, by: y0, vx: dx / d * sp * 9 + (Math.random() - .5) * 4, vy: dy / d * sp * 9 + (Math.random() - .5) * 4,
          vr: (Math.random() - .5) * .12, vz: .004 + Math.random() * .01, delay: d / maxR * 180 });
      });
    }

    const start = performance.now();
    let raf, frozen = false, revealed = false, done = false;
    const lastCrack = { n: 0 };

    const drawEye = (t) => {
      const e = t - T.eye;
      // expanding blue concentric circles
      for (let i = 0; i < 9; i++) {
        const r = (e - i * 110) * 1.9;
        if (r > 0 && r < maxR * 1.3) {
          const f = 1 - r / (maxR * 1.3);
          ctx.strokeStyle = i % 3 === 0 ? `rgba(255,255,255,${f})` : `rgba(${i % 2 ? '47,123,255' : '0,229,255'},${f})`;
          ctx.lineWidth = 3 + 9 * f; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.283); ctx.stroke();
        }
      }
      // the Six Eyes iris + pupil, igniting at the centre
      const ir = Math.min(1, Math.max(0, (e - 100) / 400)) * Math.min(w, h) * .13;
      if (ir > 0) {
        const g = ctx.createRadialGradient(cx, cy, ir * .15, cx, cy, ir);
        g.addColorStop(0, '#000'); g.addColorStop(.25, '#0a1a5c'); g.addColorStop(.55, '#2f7bff'); g.addColorStop(.85, '#00E5FF'); g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, ir, 0, 6.283); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.5;
        for (let k = 0; k < 6; k++) { const a = k * 1.047 + e / 900; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * ir * .3, cy + Math.sin(a) * ir * .3); ctx.lineTo(cx + Math.cos(a) * ir, cy + Math.sin(a) * ir); ctx.stroke(); }
      }
    };

    const drawChaos = (t) => {
      const k = Math.min(1, (t - T.chaos) / 900);
      // fracturing space lines
      if (cracks.length < 70 && Math.random() < .6 + k) cracks.push(makeCrack());
      for (const cr of cracks) {
        cr.at = Math.min(cr.pts.length - 1, cr.at + .45);
        ctx.strokeStyle = cr.col; ctx.lineWidth = cr.w;
        ctx.beginPath(); ctx.moveTo(cr.pts[0][0], cr.pts[0][1]);
        for (let i = 1; i <= cr.at; i++) ctx.lineTo(cr.pts[i | 0][0], cr.pts[i | 0][1]);
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
      // overlapping text strings, flickering and swapping
      for (const s of strings) {
        if (t < s.born) continue;
        s.life++;
        if (Math.random() < .14) s.txt = pick(LEX);
        if (Math.random() < .03) { s.x = Math.random() * w; s.y = Math.random() * h; }
        ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot + Math.sin(t / 300 + s.life) * .02);
        ctx.font = `${Math.max(10, s.s * (.7 + k * .5))}px "Noto Sans JP", Orbitron, monospace`;
        ctx.fillStyle = s.col; ctx.globalAlpha = (.25 + Math.random() * .6) * k + .1;
        ctx.shadowColor = s.col; ctx.shadowBlur = s.s > 50 ? 20 : 0;
        ctx.fillText(s.txt, 0, 0); ctx.restore();
      }
      ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    };

    const frame = (now) => {
      const t = now - start;
      if (t >= T.end) { if (!done) { done = true; onDone(); } return; }

      if (t < T.freeze) {
        // translucent black keeps motion trails; opaque early on
        ctx.fillStyle = t < T.chaos ? 'rgba(0,0,0,.35)' : 'rgba(0,0,0,.28)';
        ctx.fillRect(0, 0, w, h);
        if (t >= T.eye) drawEye(t);
        if (t >= T.chaos) drawChaos(t);
        // jittering zoom lines / info-flood scanlines
        if (t >= T.chaos) {
          ctx.strokeStyle = 'rgba(0,229,255,.5)'; ctx.lineWidth = 1;
          for (let i = 0; i < 10; i++) { const y = Math.random() * h; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y + (Math.random() - .5) * 8); ctx.stroke(); }
        }
        // white flash (blindfold off)
        if (t >= T.flash) {
          const f = 1 - (t - T.flash) / 900;
          if (f > 0) { ctx.fillStyle = `rgba(255,255,255,${f})`; ctx.fillRect(0, 0, w, h); }
        }
      } else if (t < T.shatter) {
        // everything freezes in place
        if (!frozen) { frozen = true; sctx.drawImage(c, 0, 0); }
        ctx.drawImage(snap, 0, 0);
        // fine white fracture line crawling across the frozen frame just before it breaks
        const p = (t - T.freeze) / (T.shatter - T.freeze);
        ctx.strokeStyle = `rgba(255,255,255,${.4 + p * .6})`; ctx.lineWidth = 1 + p * 2;
        ctx.beginPath(); ctx.moveTo(cx, cy);
        for (let i = 0; i < 8; i++) ctx.lineTo(cx + Math.cos(i * .8) * p * maxR * (i / 8 + .3), cy + Math.sin(i * 1.3) * p * maxR * (i / 8 + .3));
        ctx.stroke();
      } else {
        if (!revealed) { revealed = true; onReveal(); }
        const e = t - T.shatter;
        ctx.clearRect(0, 0, w, h);
        for (const s of shards) {
          const te = Math.max(0, e - s.delay);
          if (te === 0) {
            ctx.save(); ctx.beginPath(); s.tri.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.clip(); ctx.drawImage(snap, s.bx, s.by, cw, ch, s.bx, s.by, cw, ch); ctx.restore(); continue;
          }
          const f = te / 16; // frames elapsed
          const a = Math.max(0, 1 - te / 800);
          if (a <= 0) continue;
          const dx = s.vx * f * (1 + f * .02), dy = s.vy * f * (1 + f * .02);
          ctx.save(); ctx.globalAlpha = a;
          ctx.translate(s.mx + dx, s.my + dy); ctx.rotate(s.vr * f); ctx.scale(1 + s.vz * f, 1 + s.vz * f); ctx.translate(-s.mx, -s.my);
          ctx.beginPath(); s.tri.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
          ctx.clip(); ctx.drawImage(snap, s.bx, s.by, cw, ch, s.bx, s.by, cw, ch);
          ctx.strokeStyle = 'rgba(0,229,255,.9)'; ctx.lineWidth = 2; ctx.stroke();
          ctx.restore();
        }
      }
      raf = requestAnimationFrame(frame);
    };
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
    raf = requestAnimationFrame(frame);
    return () => cancelAnimationFrame(raf);
  }, []);
  return (
    <div onClick={() => { onReveal(); onDone(); }} className="fixed inset-0 z-50 cursor-pointer" role="presentation" aria-hidden="true">
      <canvas ref={cv} className="absolute inset-0" />
      <div className="absolute bottom-6 inset-x-0 text-center font-display text-[10px] tracking-[.5em] text-white/40 uppercase">click to skip</div>
    </div>
  );
}

/* ───────────────── The Void: inverted cosmic tunnel ───────────────── */
function VoidBackground({ paused }) {
  const ref = useRef(null);
  useEffect(() => {
    if (paused) return;
    const S = .5, c = ref.current, ctx = c.getContext('2d');
    let w, h, cx, cy, raf, eqs, parts;
    const init = () => {
      w = innerWidth; h = innerHeight; c.width = w * S; c.height = h * S; ctx.setTransform(S, 0, 0, S, 0, 0); cx = w / 2; cy = h / 2;
      eqs = Array.from({ length: 9 }, () => spawnEq(true));
      parts = Array.from({ length: Math.min(130, Math.floor(w * h / 14000)) }, () => spawnPart(true));
    };
    function spawnEq(rand) {
      const a = Math.random() * 6.283, rad = .25 + Math.random() * 1.1;
      return { txt: pick(EQS), x: Math.cos(a) * rad, y: Math.sin(a) * rad, z: rand ? .1 + Math.random() * .9 : 1, sp: .0012 + Math.random() * .0016, col: pick(['0,229,255', '255,255,255', '181,140,255']) };
    }
    function spawnPart(rand) {
      const a = Math.random() * 6.283, rad = .05 + Math.random() * 1.3;
      return { x: Math.cos(a) * rad, y: Math.sin(a) * rad, z: rand ? Math.random() : 1, sp: .002 + Math.random() * .004 };
    }
    let skip = false;
    const draw = (t) => {
      raf = requestAnimationFrame(draw);
      skip = !skip; if (skip) return; // run at ~30fps
      ctx.clearRect(0, 0, w, h);
      const R = Math.max(w, h);
      // thin neon-cyan geometric grid: receding frames + radial rays toward the vanishing point
      const off = REDUCED ? 0 : (t / 5200) % 1, N = 12;
      ctx.lineWidth = 1;
      for (let i = 0; i < N; i++) {
        const s = Math.pow((i + off) / N, 2.4), ww = s * w * 1.7, hh = s * h * 1.7;
        ctx.strokeStyle = `rgba(0,229,255,${.05 + s * .22})`;
        ctx.strokeRect(cx - ww / 2, cy - hh / 2, ww, hh);
      }
      ctx.strokeStyle = 'rgba(0,229,255,.10)';
      ctx.beginPath();
      for (let i = 0; i <= 14; i++) {
        const x = (i / 14) * w * 1.4 - w * .2;
        ctx.moveTo(cx, cy); ctx.lineTo(x, -h * .2); ctx.moveTo(cx, cy); ctx.lineTo(x, h * 1.2);
      }
      for (let j = 1; j < 9; j++) { const y = (j / 9) * h; ctx.moveTo(cx, cy); ctx.lineTo(-w * .2, y); ctx.moveTo(cx, cy); ctx.lineTo(w * 1.2, y); }
      ctx.stroke();
      // particle stream flying past (information flood, frozen-in-place observer)
      for (const p of parts) {
        const z0 = p.z; if (!REDUCED) p.z -= p.sp;
        if (p.z <= .02) { Object.assign(p, spawnPart(false)); continue; }
        const k = 1 / p.z * .18, k0 = 1 / (z0 + .03) * .18;
        const x = cx + p.x * k * R * .5, y = cy + p.y * k * R * .5, x0 = cx + p.x * k0 * R * .5, y0 = cy + p.y * k0 * R * .5;
        const a = Math.min(.9, (1 - p.z) * 1.2);
        ctx.strokeStyle = `rgba(0,229,255,${a})`; ctx.lineWidth = Math.min(2.2, .4 + (1 - p.z) * 2);
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x, y); ctx.stroke();
      }
      // glowing floating equations drifting past
      ctx.textAlign = 'center';
      for (const e of eqs) {
        if (!REDUCED) e.z -= e.sp;
        if (e.z <= .08) { Object.assign(e, spawnEq(false)); continue; }
        const k = 1 / e.z * .2, x = cx + e.x * k * R * .5, y = cy + e.y * k * R * .5;
        if (x < -200 || x > w + 200 || y < -100 || y > h + 100) { Object.assign(e, spawnEq(false)); continue; }
        const size = Math.min(70, 8 + k * 14), a = Math.min(.55, (1 - e.z) * .9) * Math.min(1, e.z * 6);
        ctx.font = `${size}px Orbitron, "Noto Sans JP", monospace`;
        ctx.shadowColor = `rgb(${e.col})`; ctx.shadowBlur = 6;
        ctx.fillStyle = `rgba(${e.col},${a})`; ctx.fillText(e.txt, x, y);
      }
      ctx.shadowBlur = 0;
    };
    init(); raf = requestAnimationFrame(draw);
    addEventListener('resize', init);
    return () => { cancelAnimationFrame(raf); removeEventListener('resize', init); };
  }, [paused]);
  return <canvas ref={ref} className="fixed inset-0 z-0 w-full h-full pointer-events-none" aria-hidden="true" />;
}

/* ───────────────────────── Six Eyes graphic ───────────────────────── */
function SixEyes() {
  const [p, setP] = useState({ x: 0, y: 0 });
  useEffect(() => {
    const m = (e) => setP({ x: (e.clientX / innerWidth - .5) * 2, y: (e.clientY / innerHeight - .5) * 2 });
    addEventListener('pointermove', m); return () => removeEventListener('pointermove', m);
  }, []);
  return (
    <svg viewBox="0 0 400 400" className="w-full max-w-[420px] mx-auto" role="img" aria-label="Stylised Six Eyes iris">
      <defs>
        <radialGradient id="iris" cx="50%" cy="50%" r="50%">
          <stop offset="0" stopColor="#000" /><stop offset=".22" stopColor="#030a38" />
          <stop offset=".5" stopColor="#2f7bff" /><stop offset=".8" stopColor="#00E5FF" /><stop offset="1" stopColor="#ffffff" stopOpacity=".1" />
        </radialGradient>
        <filter id="bloom"><feGaussianBlur stdDeviation="6" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
      </defs>
      <g className="iris-spin" style={{ transformOrigin: '200px 200px' }} filter="url(#bloom)" fill="none" stroke="#00E5FF" strokeOpacity=".7">
        <circle cx="200" cy="200" r="190" strokeDasharray="2 10" />
        <circle cx="200" cy="200" r="168" />
        {Array.from({ length: 6 }, (_, i) => <path key={i} d={`M200 200 L${200 + Math.cos(i * 1.047) * 190} ${200 + Math.sin(i * 1.047) * 190}`} strokeOpacity=".35" />)}
        {Array.from({ length: 6 }, (_, i) => <circle key={'s' + i} cx={200 + Math.cos(i * 1.047) * 168} cy={200 + Math.sin(i * 1.047) * 168} r="6" fill="#00E5FF" />)}
      </g>
      <g transform={`translate(${p.x * 12} ${p.y * 10})`} filter="url(#bloom)">
        <circle cx="200" cy="200" r="120" fill="url(#iris)" />
        <circle cx="200" cy="200" r="120" fill="none" stroke="#fff" strokeOpacity=".8" strokeWidth="1.5" />
        <circle cx="200" cy="200" r="44" fill="#000" />
        <circle cx="200" cy="200" r="44" fill="none" stroke="#00E5FF" strokeWidth="2" />
        <circle cx="178" cy="178" r="9" fill="#fff" opacity=".9" />
      </g>
    </svg>
  );
}

/* ───────────────────── Limitless technique visualiser ───────────────────── */
function TechViz({ kind }) {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current, ctx = c.getContext('2d'), W = c.width = 420, H = c.height = 260, cx = W / 2, cy = H / 2;
    let raf, tt = 0, vis = true;
    const io = new IntersectionObserver(([en]) => { vis = en.isIntersecting; }, { threshold: 0 }); io.observe(c);
    const ps = Array.from({ length: 50 }, () => ({ a: Math.random() * 6.283, r: 20 + Math.random() * 110, ph: Math.random() }));
    const draw = () => {
      if (!vis) { raf = requestAnimationFrame(draw); return; }
      tt += REDUCED ? 0 : 1;
      ctx.fillStyle = document.body.classList.contains('sukuna-mode') ? 'rgba(13,2,4,.3)' : 'rgba(2,2,14,.28)'; ctx.fillRect(0, 0, W, H);
      const L = (tt % 360) / 360;
      // canvas colours can't read CSS variables, so pick the palette per frame
      const SK = document.body.classList.contains('sukuna-mode');
      const C = SK ? { cy: '255,0,60', cyH: '#ff003c', bl: '255,170,0', blH: '#ffaa00', re: '255,0,60', reH: '#ff003c', pu: '#ff7800', puL: '#ffc58a', puR: '255,120,0' }
                   : { cy: '0,229,255', cyH: '#00E5FF', bl: '60,140,255', blH: '#2f7bff', re: '255,59,92', reH: '#ff3b5c', pu: '#b58cff', puL: '#d9c2ff', puR: '181,140,255' };
      if (SK && kind === 'blue') {
        // Cleave: a sudden burst of crisscrossing red-and-black cuts on a touched target
        const burst = Math.floor(L * 3), p = (L * 3) % 1, k = Math.min(1, p / .35), fade = p > .7 ? 1 - (p - .7) / .3 : 1;
        const rnd = (i) => { const v = Math.sin((burst + 1) * 91.7 + i * 12.9898) * 43758.5453; return v - Math.floor(v); };
        ctx.strokeStyle = 'rgba(234,230,223,.9)'; ctx.lineWidth = 1.5; ctx.strokeRect(cx - 18, cy - 18, 36, 36);
        ctx.lineCap = 'square';
        for (let i = 0; i < 9; i++) {
          const a = rnd(i) * 3.1416, r = 130 + rnd(i + 20) * 60, ox = (rnd(i + 40) - .5) * 70, oy = (rnd(i + 60) - .5) * 50;
          const x1 = cx + ox - Math.cos(a) * r, y1 = cy + oy - Math.sin(a) * r, x2 = x1 + Math.cos(a) * r * 2 * k, y2 = y1 + Math.sin(a) * r * 2 * k;
          ctx.shadowBlur = 0; ctx.strokeStyle = `rgba(0,0,0,${fade})`; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
          ctx.shadowColor = '#ff003c'; ctx.shadowBlur = 10; ctx.strokeStyle = `rgba(255,0,60,${fade})`; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        }
        ctx.shadowBlur = 0;
      } else if (SK && kind === 'red') {
        // Dismantle: a clean diagonal air slash with a rippling distortion; the target splits along it
        const p = (L * 2) % 1, k = Math.min(1, p / .4), fade = p > .6 ? 1 - (p - .6) / .4 : 1, split = p > .4 ? Math.min(14, (p - .4) * 40) : 0;
        const tx = cx - 22, ty = cy - 22;
        ctx.strokeStyle = 'rgba(234,230,223,.9)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(tx - split, ty - split); ctx.lineTo(tx + 44 - split, ty - split); ctx.lineTo(tx - split, ty + 44 - split); ctx.closePath(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(tx + 44 + split, ty + split); ctx.lineTo(tx + 44 + split, ty + 44 + split); ctx.lineTo(tx + split, ty + 44 + split); ctx.closePath(); ctx.stroke();
        const sx = cx + 182, sy = cy - 182, hx = sx - 364 * k, hy = sy + 364 * k;
        ctx.lineCap = 'round';
        ctx.shadowColor = '#b347ff'; ctx.shadowBlur = 16; ctx.strokeStyle = `rgba(179,71,255,${.5 * fade})`; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(hx, hy); ctx.stroke();
        ctx.shadowColor = '#ff003c'; ctx.shadowBlur = 14; ctx.strokeStyle = `rgba(255,255,255,${fade})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(hx, hy); ctx.stroke();
        ctx.strokeStyle = `rgba(255,0,60,${.8 * fade})`; ctx.lineWidth = 4; ctx.globalCompositeOperation = 'lighter'; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(hx, hy); ctx.stroke(); ctx.globalCompositeOperation = 'source-over';
        for (let i = 1; i <= 3; i++) { ctx.strokeStyle = `rgba(179,71,255,${(.4 - i * .1) * fade})`; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(hx, hy, 8 + i * 9 + p * 12, 0, 6.283); ctx.stroke(); }
        ctx.shadowBlur = 0;
      } else if (SK && kind === 'purple') {
        // Fuga: embers gather, the fire arrow is loosed across the frame, then the firestorm
        const ax0 = 60, ax1 = W - 70, arrow = (hx, len) => {
          const g = ctx.createLinearGradient(hx - len, 0, hx, 0);
          g.addColorStop(0, 'rgba(255,0,60,0)'); g.addColorStop(.4, 'rgba(255,0,60,.8)'); g.addColorStop(.75, '#ff7800'); g.addColorStop(.92, '#ffd34d'); g.addColorStop(1, '#fff');
          ctx.shadowColor = '#ff7800'; ctx.shadowBlur = 20; ctx.fillStyle = g; ctx.beginPath();

function HiddenOrbs({ onCollide }) {
  const Z = { x: 0, y: 0 };
  const [off, setOff] = useState({ blue: Z, red: Z });
  const [drag, setDrag] = useState(null);
  const st = useRef(null);
  const centers = (o) => ({
    blue: { x: ORB_EDGE + ORB / 2 + o.blue.x, y: ORB_TOP + ORB / 2 + o.blue.y },
    red: { x: innerWidth - ORB_EDGE - ORB / 2 + o.red.x, y: ORB_TOP + ORB / 2 + o.red.y },
  });
  const handlers = (kind) => ({
    onPointerDown: (e) => { e.currentTarget.setPointerCapture(e.pointerId); st.current = { kind, sx: e.clientX, sy: e.clientY, ox: off[kind].x, oy: off[kind].y }; setDrag(kind); },
    onPointerMove: (e) => {
      const s = st.current; if (!s || s.kind !== kind) return;
      const next = { ...off, [kind]: { x: s.ox + e.clientX - s.sx, y: s.oy + e.clientY - s.sy } };
      setOff(next);
      const c = centers(next);
      if (Math.hypot(c.blue.x - c.red.x, c.blue.y - c.red.y) < ORB * .85) {
        st.current = null; setDrag(null);
        onCollide({ x: (c.blue.x + c.red.x) / 2, y: (c.blue.y + c.red.y) / 2 });
      }
    },
    onPointerUp: () => { st.current = null; setDrag(null); setOff(o => ({ ...o, [kind]: Z })); },
    onPointerCancel: () => { st.current = null; setDrag(null); setOff(o => ({ ...o, [kind]: Z })); },
  });
  return (
    <>
      <Orb kind="blue" offset={off.blue} dragging={drag === 'blue'} handlers={handlers('blue')} />
      <Orb kind="red" offset={off.red} dragging={drag === 'red'} handlers={handlers('red')} />
    </>
  );
}

/* Hollow Purple: flash + colour merge → purple sphere tears the layout away → boss arena */
const H = { glide: 700, sweep: 1500, arena: 4300, end: 5200 };
const lerp = (a, b, k) => a + (b - a) * Math.min(1, Math.max(0, k));
const ease = (k) => k * k * (3 - 2 * k);

function FireArrow({ x, y, w }) {
  const h = w * .12;
  return <div className="absolute left-0 top-0" style={{ width: w, height: h, transform: `translate(${x - w}px,${y - h / 2}px)`,
    filter: 'drop-shadow(0 0 22px #ff7800) drop-shadow(0 0 60px #ff003c)',
    background: 'linear-gradient(90deg, rgba(255,0,60,0), rgba(255,0,60,.7) 35%, #ff7800 70%, #ffd34d 90%, #fff 100%)',
    clipPath: 'polygon(0 42%, 90% 42%, 90% 0, 100% 50%, 90% 100%, 90% 58%, 0 58%)' }} />;
}
function FireBlast({ k }) {
  return <div className="absolute left-1/2 top-1/2 rounded-full" style={{ width: '170vmax', height: '170vmax',
    background: 'radial-gradient(circle, #fff 0, #ffd34d 14%, #ff7800 32%, #ff003c 52%, rgba(255,0,60,0) 70%)',
    transform: `translate(-50%,-50%) scale(${lerp(.04, 1, ease(Math.min(1, k * 1.6)))})`, opacity: k < .6 ? 1 : Math.max(0, 1 - (k - .6) / .4) }} />;
}

function HollowSequence({ at, onArena, onEnd }) {
  const sk = useRef(SukunaMode.isOn()).current;
  const [e, setE] = useState(0);
  const fired = useRef({ a: false, e: false });
  const shards = useMemo(() => Array.from({ length: 24 }, () => {
    const x = Math.random() * 110 - 5, ang = Math.random() * 6.283, d = 300 + Math.random() * 800;
    return { x, y: Math.random() * 100, sz: 70 + Math.random() * 190, dx: Math.cos(ang) * d, dy: Math.sin(ang) * d, rot: (Math.random() - .5) * 900,
      poly: `polygon(${Math.random() * 30}% 0, 100% ${Math.random() * 40}%, ${60 + Math.random() * 40}% 100%, 0 ${60 + Math.random() * 40}%)`,
      delay: (x + 10) / 125 * (H.arena - H.sweep) };
  }), []);
  useEffect(() => {
    const t0 = performance.now(); let raf;
    const f = (n) => {
      const el = n - t0; setE(el);
      if (el >= H.arena && !fired.current.a) { fired.current.a = true; onArena(); }
      if (el >= H.end) { if (!fired.current.e) { fired.current.e = true; onEnd(); } return; }
      raf = requestAnimationFrame(f);
    };
    raf = requestAnimationFrame(f);
    return () => cancelAnimationFrame(raf);
  }, []);

  const W = innerWidth, Hh = innerHeight, D = Math.min(W, Hh) * .75;
  let x = at.x, y = at.y, sc = 1;
  if (e < H.glide) { sc = lerp(.15, 1, ease(e / H.glide)); }
  else if (e < H.sweep) { const k = ease((e - H.glide) / (H.sweep - H.glide)); x = lerp(at.x, -.18 * W, k); y = lerp(at.y, Hh * .5, k); }
  else { const k = (e - H.sweep) / (H.arena - H.sweep); x = lerp(-.18 * W, 1.25 * W, k); y = Hh * .5 + Math.sin(k * 14) * Hh * .1; sc = 1 + Math.sin(k * 30) * .04; }
  const sweeping = e >= H.sweep && e < H.arena + 400;

  // layout destruction: erase page behind the sphere
  useEffect(() => {
    const page = document.getElementById('page'), root = document.getElementById('root');
    if (!page) return;
    if (e >= H.sweep) { page.classList.add('shred'); page.style.setProperty('--p', String((x + D * .38) / W * 100)); }
    root.classList.toggle('shaking', e > 400 && e < H.arena);
  }, [e]);
  useEffect(() => () => {
    const page = document.getElementById('page'); const root = document.getElementById('root');
    if (page) { page.classList.remove('shred'); page.style.removeProperty('--p'); }
    root.classList.remove('shaking');
  }, []);

  const mergeK = Math.min(1, e / 350);
  const violet = e < 500 ? .7 : e < H.sweep ? .42 : e < H.arena ? .12 : Math.max(0, .55 * (1 - (e - H.arena) / (H.end - H.arena)));
  const white = e < 450 ? 1 - e / 450 : (e >= H.arena && e < H.arena + 400) ? .9 * (1 - (e - H.arena) / 400) : 0;
  // Gojo: cyan + rose merge into a purple sphere. Sukuna: gold + crimson merge into Fuga, a fire arrow that ends in a firestorm.
  const cA = sk ? '255,170,0' : '6,182,212', cB = sk ? '255,0,60' : '225,29,72', cP = sk ? '255,90,0' : '147,51,234', cV = sk ? '255,50,0' : '88,28,200';
  return (
    <div className="fixed inset-0 z-[60] overflow-hidden" style={{ cursor: 'wait' }}>
      <div className="absolute inset-0" style={{ background: `rgba(${cV},${violet})` }} />
      {e < 500 && <div className="absolute inset-0" style={{ background:
        `radial-gradient(circle at ${at.x - 110 * (1 - mergeK)}px ${at.y}px, rgba(${cA},.9), transparent 300px), radial-gradient(circle at ${at.x + 110 * (1 - mergeK)}px ${at.y}px, rgba(${cB},.9), transparent 300px)` }} />}
      <div className="absolute inset-0" style={{ background: `radial-gradient(circle at ${at.x}px ${at.y}px, rgba(${cP},${e < H.sweep ? .6 : 0}), transparent 55%)` }} />
      {e < H.arena + 400 && (sk && e >= H.sweep ? <FireArrow x={x + D * .5} y={y} w={D * 1.9} /> : (
        <div className="absolute left-0 top-0 rounded-full"
          style={{ width: D, height: D, transform: `translate(${x - D / 2}px,${y - D / 2}px) scale(${sc})`,
            backgroundImage: sk ? 'radial-gradient(circle, rgba(255,255,255,.95) 0, rgba(255,211,77,.7) 22%, rgba(255,90,0,0) 62%)' : 'radial-gradient(circle, rgba(255,255,255,.95) 0, rgba(233,213,255,.6) 22%, rgba(147,51,234,0) 62%)',
            boxShadow: `0 0 50px rgba(${cP},1), 0 0 180px rgba(${cP},.85), inset 0 0 90px rgba(255,255,255,.5)` }} />
      ))}
      {sweeping && !sk && shards.map((s, i) => (
        <div key={i} className="absolute" style={{ left: s.x + 'vw', top: s.y + 'vh', width: s.sz, height: s.sz, clipPath: s.poly,
          background: 'linear-gradient(135deg, rgba(255,255,255,.35), rgba(147,51,234,.5))', '--dx': s.dx + 'px', '--dy': s.dy + 'px', '--rot': s.rot + 'deg',
          animation: `shardFly 1.3s ease-in ${s.delay}ms both` }} />
      ))}
      {sweeping && sk && shards.map((s, i) => (
        <div key={i} className="absolute" style={{ left: s.x + 'vw', top: s.y + 'vh', width: s.sz * .5, height: s.sz * .5, clipPath: s.poly,
          background: 'linear-gradient(135deg, rgba(255,230,150,.6), rgba(255,60,0,.6))', '--dx': s.dx + 'px', '--dy': s.dy - 200 + 'px', '--rot': s.rot + 'deg',
          animation: `shardFly 1.3s ease-in ${s.delay}ms both` }} />
      ))}
      {sk && e >= H.arena - 500 && <FireBlast k={(e - (H.arena - 500)) / (H.end - H.arena + 500)} />}
      <div className="absolute inset-0" style={{ opacity: white, background: sk ? '#fff3d6' : '#fff' }} />
    </div>
  );
}

/* ═══════════════ Phase 2: Satoru Gojo boss fight (scripted state machine) ═══════════════ */
const PMAX = 200;
const FX_BY_TURN = (n) => n <= 2 ? 'tp' : n === 3 ? 'blue' : n === 4 ? 'red' : 'domain';
const FIGHT0 = { stage: 'menu', turn: 1, hp: PMAX, lock: 0, guard: false, fx: '', floats: [], log: 'Satoru Gojo has not moved. He does not need to.', count: null, dotPhase: false };
const gk = (g, k) => (SukunaMode.isOn() ? k : g); // Gojo text / Sukuna text for fight messages
let floatId = 0;
const addFloat = (s, text, side, tone) => [...s.floats, { id: ++floatId, text, side, tone }];

function fightReducer(s, a) {
  switch (a.type) {
    case 'act': {
      const dc = a.name === 'Domain Counter';
      return { ...s, stage: 'player', guard: dc, log: `You use ${a.name}.`,
        floats: addFloat(s, dc ? '[Simple Domain raised]' : gk('[0 Damage - Blocked by Infinity]', '[0 Damage - Shrugged off]'), 'boss', dc ? 'white' : 'cyan') };
    }
    case 'skip': return { ...s, stage: 'player', lock: s.lock - 1, guard: false, log: gk('[Spacial Disorientation] — you cannot act.', '[Shredded] — you cannot act.'), floats: addFloat(s, '[ACTIONS LOCKED]', 'player', 'violet') };
    case 'enemyStart': return { ...s, stage: 'enemy', fx: FX_BY_TURN(s.turn) };
    case 'log': return { ...s, log: a.text };
    case 'hit': return { ...s, hp: Math.max(0, s.hp - a.n), floats: addFloat(s, '-' + a.n, 'player', 'red') };
    case 'lock': return { ...s, lock: 1, floats: addFloat(s, gk('[Spacial Disorientation]', '[Shredded]'), 'player', 'violet') };
    case 'count': return { ...s, count: a.ms };
    case 'dot': return { ...s, dotPhase: true, hp: Math.max(0, s.hp - a.n) };
    case 'enemyEnd': return s.hp <= 0 ? { ...s, stage: 'lost', fx: '' } : { ...s, stage: 'menu', turn: s.turn + 1, fx: '', guard: false };
    case 'lost': return { ...s, stage: 'lost' };
    case 'rm': return { ...s, floats: s.floats.filter(f => f.id !== a.id) };
    case 'reset': return { ...FIGHT0 };
    default: return s;
  }
}

function useTween(v) {
  const [d, setD] = useState(v); const r = useRef(v);
  useEffect(() => {
    let raf;
    const step = () => { r.current += (v - r.current) * .16; if (Math.abs(v - r.current) < .5) r.current = v; setD(r.current); if (r.current !== v) raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step); return () => cancelAnimationFrame(raf);
  }, [v]);
  return d;
}

// Infinite Void as in the anime: stark white field, drifting black spots, a glossy black mirror floor,
// translucent planetary orbits, expanding white rings and floating equations — then the stasis lock.
const VOID_EQ = ['∞', 'lim x→∞', '∮ κ dA = 2πχ', 'Σ 1/n² = π²/6', 'dim ℋ = ∞', '∀ε>0 ∃δ>0', 'S² × ℝ', 'Ω = ∫ ω ∧ dω', 'ψ(r,t)', '∇·B = 0', 'ℵ₀', 'det(A − λI) = 0', 'e^{iπ} + 1 = 0', '1/2 + 1/4 + 1/8 …'];

function NegativeFlash() {
  const [on, setOn] = useState(true);
  useEffect(() => { const t = setTimeout(() => setOn(false), 200); return () => clearTimeout(t); }, []);
  // 0.2s inception: the whole screen inverts (black → white, white → black)
  return on ? <div className="fixed inset-0 z-[48] pointer-events-none" style={{ backdropFilter: 'invert(1)', WebkitBackdropFilter: 'invert(1)', background: 'rgba(255,255,255,.12)' }} /> : null;
}

function DomainVoid() {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current, ctx = c.getContext('2d');
    const w = c.width = innerWidth, h = c.height = innerHeight, hz = Math.round(h * .66);
    const sc = document.createElement('canvas'); sc.width = w; sc.height = hz; const s = sc.getContext('2d');
    const lw = Math.ceil(w / 9), lh = Math.ceil(hz / 9);
    const low = document.createElement('canvas'); low.width = lw; low.height = lh;
    const lx = low.getContext('2d'), img = lx.createImageData(lw, lh), px = img.data;
    const cx = w / 2, cy = hz * .5, reach = Math.hypot(cx, hz);
    const blobs = Array.from({ length: 13 }, () => ({ x: Math.random() * lw, y: Math.random() * lh, r: 4 + Math.random() * 15,
      vx: (Math.random() - .5) * .02, vy: (Math.random() - .5) * .02, ph: Math.random() * 6.28, sp: .3 + Math.random() * .8 }));
    const orbits = Array.from({ length: 7 }, (_, i) => ({ rx: 90 + i * (w * .07), tilt: .25 + Math.random() * .4, rot: Math.random() * 3.14, rs: (Math.random() - .5) * .00035,
      pl: Math.random() * 6.28, ps: (.0003 + Math.random() * .0007) * (i % 2 ? 1 : -1), pr: 3 + Math.random() * 5 }));
    const eqs = Array.from({ length: 14 }, () => ({ txt: pick(VOID_EQ), x: Math.random() * w, y: Math.random() * hz, sp: (.012 + Math.random() * .06) * (Math.random() < .5 ? 1 : -1), size: 14 + Math.random() * 30 }));
    const rings = [];
    let raf, last = performance.now(), vt = 0, spawn = 0;
    const t0 = last;

    const lockGeometry = () => { // faint cold geometry: the victim pinned at the centre of the Limitless
      ctx.save(); ctx.globalCompositeOperation = 'difference'; ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1;
      for (let i = 1; i <= 6; i++) { ctx.beginPath(); ctx.arc(cx, cy, i * 46, 0, 6.283); ctx.stroke(); }
      for (let k = 0; k < 3; k++) { ctx.beginPath(); for (let i = 0; i <= 6; i++) { const a = i * 1.0472 + k * .35; ctx.lineTo(cx + Math.cos(a) * (130 + k * 70), cy + Math.sin(a) * (130 + k * 70)); } ctx.stroke(); }
      ctx.beginPath(); ctx.moveTo(cx - 300, cy); ctx.lineTo(cx + 300, cy); ctx.moveTo(cx, cy - 300); ctx.lineTo(cx, cy + 300); ctx.stroke();
      ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, 12, 0, 6.283); ctx.stroke();
      ctx.restore();
    };

    let skip = false;
    const frame = (now) => {
      skip = !skip; if (skip) { raf = requestAnimationFrame(frame); return; } // ~30fps
      const t = now - t0, dt = Math.min(80, now - last); last = now;
      if (t < 200) { raf = requestAnimationFrame(frame); return; } // 0.2s of negative flash first
      const k = Math.min(1, Math.max(0, (t - 1900) / 1200));       // stasis lock ramps in
      vt += dt * (1 - k);

      // base: white field with organic black spots (metaballs) over faint iris fibres
      const bl = blobs.map(b => {
        b.x += b.vx * dt * (1 - k); b.y += b.vy * dt * (1 - k);
        if (b.x < -20) b.x = lw + 20; if (b.x > lw + 20) b.x = -20; if (b.y < -20) b.y = lh + 20; if (b.y > lh + 20) b.y = -20;
        const r = b.r * (1 + .25 * Math.sin(vt * .001 * b.sp + b.ph)); return { x: b.x, y: b.y, r2: r * r };
      });
      for (let y = 0, i = 0; y < lh; y++) for (let x = 0; x < lw; x++, i += 4) {
        let f = 0; for (let j = 0; j < bl.length; j++) { const dx = x - bl[j].x, dy = y - bl[j].y; f += bl[j].r2 / (dx * dx + dy * dy + 1); }
        const ax = x - lw / 2, ay = y - lh / 2 * .75;
        f += Math.sin(Math.atan2(ay, ax) * 36 + Math.hypot(ax, ay) * .15) * .05;
        let v = (f - .85) / .45; v = v < 0 ? 0 : v > 1 ? 1 : v; v = v * v * (3 - 2 * v);
        const col = 247 - v * 241; px[i] = col; px[i + 1] = col + 2; px[i + 2] = Math.min(255, col + 9); px[i + 3] = 255;
      }
      lx.putImageData(img, 0, 0);
      s.globalCompositeOperation = 'source-over'; s.imageSmoothingEnabled = true; s.drawImage(low, 0, 0, w, hz);

      // overlapping translucent planetary orbits, rings, equations — drawn as inversions so they read on both white and black
      s.globalCompositeOperation = 'difference'; s.strokeStyle = 'rgba(255,255,255,.5)'; s.fillStyle = '#fff'; s.lineWidth = 1;
      for (const o of orbits) {
        const rot = o.rot + vt * o.rs;
        s.beginPath(); s.ellipse(cx, cy, o.rx, o.rx * o.tilt, rot, 0, 6.283); s.stroke();
        const a = o.pl + vt * o.ps, ex = Math.cos(a) * o.rx, ey = Math.sin(a) * o.rx * o.tilt;
        s.beginPath(); s.arc(cx + ex * Math.cos(rot) - ey * Math.sin(rot), cy + ex * Math.sin(rot) + ey * Math.cos(rot), o.pr, 0, 6.283); s.fill();
      }
      spawn += dt * (1 - k); if (spawn > 150) { spawn = 0; rings.push({ a: 0 }); }
      for (let i = rings.length - 1; i >= 0; i--) {
        const r = rings[i]; r.a += dt * (1 - k); const rad = r.a * 1.15;
        if (rad > reach) { rings.splice(i, 1); continue; }
        const f = 1 - rad / reach;
        s.lineWidth = 1 + f * 9; s.strokeStyle = `rgba(255,255,255,${.35 + f * .65})`; s.beginPath(); s.arc(cx, cy, rad, 0, 6.283); s.stroke();
      }
      s.textAlign = 'left'; s.globalAlpha = .6;
      for (const e of eqs) {
        e.x += e.sp * dt * (1 - k); if (e.x > w + 200) e.x = -300; if (e.x < -300) e.x = w + 200;
        s.font = `${e.size}px "Times New Roman", Georgia, serif`; s.fillText(e.txt, e.x, e.y);
      }
      s.globalAlpha = 1; s.globalCompositeOperation = 'source-over';

      // composite: scene above, glossy dark mirror floor reflecting it below the horizon
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.drawImage(sc, 0, 0);
      if (k > 0) { ctx.globalAlpha = .4 * k; ctx.drawImage(sc, 9 * k, 0); ctx.globalAlpha = 1; } // double vision
      const fl = ctx.createLinearGradient(0, hz, 0, h); fl.addColorStop(0, '#0b0d14'); fl.addColorStop(1, '#000');
      ctx.fillStyle = fl; ctx.fillRect(0, hz, w, h - hz);
      ctx.save(); ctx.globalAlpha = .55; ctx.setTransform(1, 0, 0, -1, 0, 2 * hz); ctx.drawImage(sc, 0, 0); ctx.restore();
      const veil = ctx.createLinearGradient(0, hz, 0, h); veil.addColorStop(0, 'rgba(0,0,0,.25)'); veil.addColorStop(1, 'rgba(0,0,0,.97)');
      ctx.fillStyle = veil; ctx.fillRect(0, hz, w, h - hz);
      ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fillRect(0, hz, w, 1.5);   // horizon of nothingness
      ctx.fillStyle = 'rgba(255,255,255,.05)'; for (let y = hz + 14, g = 10; y < h; y += g, g *= 1.35) ctx.fillRect(0, y, w, 1); // gloss

      if (k >= 1) { lockGeometry(); c.style.filter = 'blur(3.5px)'; return; } // stasis lock: freeze + heavy blur, loop stops
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
    return () => cancelAnimationFrame(raf);
  }, []);
  return <canvas ref={ref} className="absolute inset-0 w-full h-full pointer-events-none" aria-hidden="true" />;
}

const TONES = { cyan: 'text-cyan-neon', white: 'text-white', red: 'text-rose-500', violet: 'text-hollow' };

function CleaveBurst() {

        </g>)}
      </svg>
    </div>
  );
}

/* ═══════════════ Sukuna fight pattern ═══════════════ */
// Alternate Cleave ↔ Dismantle three times in a row to charge Fūga. Cleave stacks Cursed Energy Debris; Dismantle detonates it.
const SK_BOSS_MAX = 150, SK_YOU_MAX = 200, SK_COMBO_GOAL = 3;
const SK_FIGHT0 = { stage: 'menu', turn: 1, hp: SK_YOU_MAX, bossHp: SK_BOSS_MAX, debris: 0, combo: 0, last: null, ultReady: false, shrineUsed: false, fx: '', floats: [], log: 'Satoru Gojo stands before you. Cut him down.' };
const addFloats = (s, list) => list.reduce((fl, [t, side, tone]) => addFloat({ floats: fl }, t, side, tone), s.floats);

function runSukunaPattern(s, a) {
  switch (a.type) {
    case 'cast': {
      const cleave = a.skill === 'cleave';
      const detonated = cleave ? 0 : s.debris;
      const dmg = cleave ? 12 : 18 + detonated * 10;
      const chained = s.last !== null && s.last !== a.skill;           // strict alternation keeps the combo alive
      const combo = chained ? s.combo + 1 : 1;
      const ready = s.ultReady || combo >= SK_COMBO_GOAL;
      const fl = [['-' + dmg, 'boss', 'red']];
      if (!cleave && detonated) fl.push(['DEBRIS ×' + detonated + ' DETONATED', 'boss', 'violet']);
      if (ready && !s.ultReady) fl.push(['[FŪGA READY]', 'player', 'white']);
      let log = cleave ? `Cleave — rapid cuts shred Gojo. Cursed Energy Debris ×${s.debris + 1}.`
        : detonated ? `Dismantle — the blades detonate ${detonated} Debris for bonus damage!` : 'Dismantle — an invisible blade sweeps the field.';
      if (ready && !s.ultReady) log += ' Fūga is ready!';
      return { ...s, stage: 'player', fx: a.skill, bossHp: Math.max(0, s.bossHp - dmg), debris: cleave ? s.debris + 1 : 0,
        combo: Math.min(combo, SK_COMBO_GOAL), last: a.skill, ultReady: ready, log, floats: addFloats(s, fl) };
    }
    case 'fuga': return s.ultReady ? { ...s, stage: 'ult', fx: 'fuga', ultReady: false, combo: 0, last: null, log: 'Fūga — “Open.”' } : s;
    case 'fugaHit': return { ...s, bossHp: 0, floats: addFloats(s, [['-' + s.bossHp, 'boss', 'red']]) };
    case 'shrine': return s.shrineUsed ? s : { ...s, stage: 'ult', fx: 'shrine', shrineUsed: true, log: 'Domain Expansion: Malevolent Shrine — Fukuma Mizushi.' };
    case 'tick': return { ...s, bossHp: Math.max(0, s.bossHp - a.n), floats: addFloats(s, [['-' + a.n, 'boss', 'red']]) };
    case 'shrineEnd': return s.bossHp <= 0 ? { ...s, stage: 'won', fx: '' } : { ...s, stage: 'enemy', fx: '', log: 'The Shrine closes.' };
    case 'enemyStart': return { ...s, stage: 'enemy', fx: '' };
    case 'hit': return { ...s, hp: Math.max(0, s.hp - a.n), floats: addFloats(s, [['-' + a.n, 'player', 'red']]) };
    case 'enemyEnd': return s.hp <= 0 ? { ...s, stage: 'lost' } : { ...s, stage: 'menu', turn: s.turn + 1 };
    case 'log': return { ...s, log: a.text };
    case 'won': return { ...s, stage: 'won', fx: '' };
    case 'rm': return { ...s, floats: s.floats.filter(f => f.id !== a.id) };
    case 'reset': return { ...SK_FIGHT0 };
    default: return s;
  }
}

// castFuga: the 3-phase screen nuke, built straight on the DOM so it overlays any layout. It removes itself after 3.5 s.
function castFuga(onImpact) {
  const wrap = document.createElement('div');
  wrap.className = 'fuga-overlay';
  wrap.innerHTML = '<div class="fuga-dark"></div><div class="fuga-text">■ 開<small>(Open)</small></div><div class="fuga-arrow"></div><div class="fuga-flash"></div><div class="fuga-storm"></div>';
  document.body.appendChild(wrap);
  document.body.classList.add('fuga-shaking');                                 // phase 1: the chant — screen darkens, text pops, viewport shakes
  setTimeout(() => wrap.classList.add('arrow-on'), 500);                       // phase 2: the arrow forms and vibrates
  setTimeout(() => wrap.classList.add('fired'), 1500);                         // phase 3: after the 1.5 s charge, the arrow fires…
  setTimeout(() => { wrap.classList.add('impact'); onImpact(); }, 1850);       // …white flash, firestorm, boss bar wiped
  setTimeout(() => document.body.classList.remove('fuga-shaking'), 2300);
  setTimeout(() => { wrap.remove(); document.body.classList.remove('fuga-shaking'); }, 3500);   // clean up
}

function SukunaArena({ onExit }) {
  const [s, d] = React.useReducer(runSukunaPattern, SK_FIGHT0);
  const bossHp = useTween(s.bossHp), hp = useTween(s.hp);

  useEffect(() => {
    const ts = [], is = [], T = (f, ms) => ts.push(setTimeout(f, ms));
    if (s.stage === 'player') T(() => d({ type: s.bossHp <= 0 ? 'won' : 'enemyStart' }), 1300);
    if (s.stage === 'enemy') {                                                   // Gojo answers: a strike each turn, Red every third
      const heavy = s.turn % 3 === 0;
      d({ type: 'log', text: heavy ? 'Gojo — Reversal: Red! Everything is thrown away from him.' : 'Gojo vanishes — Teleportation Strike!' });
      T(() => d({ type: 'hit', n: heavy ? 24 : 12 }), 550);
      T(() => d({ type: 'enemyEnd' }), 1500);
    }
    if (s.stage === 'ult' && s.fx === 'fuga') { castFuga(() => d({ type: 'fugaHit' })); T(() => d({ type: 'won' }), 3500); }
    if (s.stage === 'ult' && s.fx === 'shrine') {                                // sure-hit cuts for as long as the Shrine stands
      is.push(setInterval(() => d({ type: 'tick', n: 12 }), 700));
      T(() => is.forEach(clearInterval), 3600);
      T(() => d({ type: 'shrineEnd' }), 4700);
    }
    return () => { ts.forEach(clearTimeout); is.forEach(clearInterval); };
  }, [s.stage, s.turn]);
  useEffect(() => { document.body.style.overflow = 'hidden'; return () => { document.body.style.overflow = ''; }; }, []);

  const menu = s.stage === 'menu';
  const stageAnim = { cleave: 'shakeScreen .12s linear 10', dismantle: 'shakeScreen .1s linear 4' }[s.fx];
  const acts = [
    { id: 'cleave', name: 'Cleave', hint: 'Rapid close-range cuts. +1 Cursed Energy Debris', go: () => d({ type: 'cast', skill: 'cleave' }) },
    { id: 'dismantle', name: 'Dismantle', hint: 'Wide-area cut. Detonates Debris for bonus damage', go: () => d({ type: 'cast', skill: 'dismantle' }) },
    { id: 'fuga', name: 'Fūga', hint: s.ultReady ? 'Divine Flame — “Open”' : 'Alternate Cleave → Dismantle → Cleave to charge', locked: !s.ultReady, go: () => d({ type: 'fuga' }) },
    { id: 'shrine', name: 'Malevolent Shrine', hint: s.shrineUsed ? 'Domain spent' : 'Domain Expansion — sure-hit cuts (once)', locked: s.shrineUsed, go: () => d({ type: 'shrine' }) },
  ];
  const next = s.last === null ? 'start with Cleave or Dismantle' : 'next: ' + (s.last === 'cleave' ? 'Dismantle' : 'Cleave');

  return (
    <div className="fixed inset-0 z-40 overflow-hidden bg-black/70">
      <div className="absolute inset-0 overflow-y-auto z-10" style={{ animation: stageAnim, transformOrigin: '50% 40%' }}>
        <div className="max-w-5xl mx-auto px-5 py-6 min-h-full flex flex-col">
          <div className="flex justify-between font-display text-[11px] tracking-[.4em] uppercase text-white/60"><span>Sukuna’s trial · Special Grade</span><span>Turn {s.turn}</span></div>

          {/* Gojo, the target */}
          <div className="relative text-center mt-4">
            <div className="relative inline-block">
              <div className="relative h-[30vh] max-h-[300px] min-h-[180px] aspect-[2/3] mx-auto overflow-hidden rounded-[50%/42%] shadow-[0_0_50px_rgb(var(--c-accent)/.55),inset_0_0_40px_rgb(var(--c-accent2)/.5)]"
                style={{ background: 'radial-gradient(ellipse at 50% 40%, #ffffff 0%, #cfeaff 55%, #5aa8ff 100%)' }}>
                <img src="gojo full body.jpg" alt="Satoru Gojo, full body" className="absolute inset-0 w-full h-full object-contain mix-blend-multiply" />
              </div>
              <div className="absolute inset-[-8%] rounded-[50%/42%] border border-dashed border-cyan-neon/60 pointer-events-none" aria-hidden="true" />
            </div>
            <h2 className="font-display font-black text-2xl md:text-3xl tracking-widest text-white bloom-text">SATORU GOJO</h2>
            <div className="mt-3 max-w-md mx-auto">
              <div className="flex justify-between font-display text-xs tracking-widest"><span className="text-white/60">HP</span><span className="text-cyan-neon tabular-nums">{Math.ceil(bossHp)} / {SK_BOSS_MAX}</span></div>
              <div className="h-3 bg-white/10 overflow-hidden rounded-sm"><div className="h-full bg-gradient-to-r from-azure to-cyan-neon shadow-[0_0_16px_rgb(var(--c-accent))]" style={{ width: Math.max(0, bossHp / SK_BOSS_MAX * 100) + '%' }} /></div>
            </div>
            {s.floats.filter(f => f.side === 'boss').map(f => (
              <div key={f.id} onAnimationEnd={() => d({ type: 'rm', id: f.id })} className={'absolute left-1/2 top-1/3 font-display font-bold text-lg md:text-xl whitespace-nowrap pointer-events-none ' + TONES[f.tone]}
                style={{ animation: 'floatUp 1.4s ease-out forwards', textShadow: '0 0 14px currentColor' }}>{f.text}</div>
            ))}
          </div>

          <div className="flex-1" />
          <p className="text-center text-lg md:text-xl text-white/90 min-h-[3.5rem] my-4" aria-live="polite">{s.log}</p>

          {/* You, Ryomen Sukuna */}
          <div className="relative max-w-xl w-full mx-auto">
            <div className="flex justify-between items-end font-display text-xs tracking-widest"><span className="text-white">YOU · RYOMEN SUKUNA</span><span className="text-white text-base tabular-nums">{Math.ceil(hp)} / {SK_YOU_MAX}</span></div>
            <div className="h-3 bg-white/10 overflow-hidden rounded-sm"><div className="h-full bg-gradient-to-r from-emerald-500 to-lime-300" style={{ width: Math.max(0, hp / SK_YOU_MAX * 100) + '%', transition: 'width .2s' }} /></div>
            {s.floats.filter(f => f.side === 'player').map(f => (
              <div key={f.id} onAnimationEnd={() => d({ type: 'rm', id: f.id })} className={'absolute left-1/2 -top-2 font-display font-bold text-2xl whitespace-nowrap pointer-events-none ' + TONES[f.tone]}
                style={{ animation: 'floatUp 1.4s ease-out forwards', textShadow: '0 0 14px currentColor' }}>{f.text}</div>
            ))}
            <div className="mt-4 flex flex-wrap items-center gap-3 font-display text-xs tracking-widest uppercase text-white/70">
              <span>Combo</span>
              {[0, 1, 2].map(i => <span key={i} className={'w-6 h-3 border border-cyan-neon/60 ' + (i < s.combo ? 'bg-cyan-neon shadow-[0_0_12px_rgb(var(--c-accent))]' : 'bg-black/40')} />)}
              <span className="ml-2">Debris ×{s.debris}</span>
              <span className={'ml-auto ' + (s.ultReady ? 'text-hollow bloom-text' : 'text-white/50')}>{s.ultReady ? 'FŪGA READY' : next}</span>
            </div>
            <div className="relative mt-4 grid sm:grid-cols-2 md:grid-cols-4 gap-4">
              {acts.map(a => (
                <button key={a.id} disabled={!menu || a.locked} onClick={a.go}
                  className={'text-left px-4 py-3 border bg-black/60 transition-all disabled:opacity-40 disabled:cursor-not-allowed hover:bg-cyan-neon/15 ' + (a.id === 'fuga' && s.ultReady ? 'border-hollow shadow-[0_0_30px_rgb(var(--c-hollow)/.7)]' : 'border-cyan-neon/50')}>
                  <div className="font-display font-bold tracking-widest uppercase text-sm text-cyan-neon">{a.name}</div>
                  <div className="text-sm text-white/70">{a.hint}</div>
                </button>
              ))}
            </div>
          </div>
          <div className="h-6" />
        </div>
      </div>

      {/* effects */}
      {s.fx === 'cleave' && <CleaveBurst />}
      {s.fx === 'dismantle' && <DismantleCut />}
      {s.fx === 'shrine' && <MalevolentShrine z={48} />}
      {(s.stage === 'won' || s.stage === 'lost') && (
        <div className="absolute inset-0 z-[49] grid place-items-center bg-black/85 text-center px-6" style={{ animation: 'frostIn .8s both' }}>
          <div>
            <p className="font-display text-xs tracking-[.5em] text-azure uppercase">{s.stage === 'won' ? 'The King of Curses' : 'Infinity held'}</p>
            <h2 className="mt-4 font-display font-black text-3xl md:text-5xl text-white bloom-text">{s.stage === 'won' ? <>KNOW YOUR PLACE.<br />GOJO IS ASH.</> : <>YOU FELL.<br />TRY AGAIN.</>}</h2>
            <p className="mt-4 text-white/60">{s.stage === 'won' ? 'Fūga — and nothing remained of the boss’s health bar.' : 'Alternate Cleave and Dismantle to charge Fūga before Gojo wears you down.'}</p>
            <div className="mt-8 flex flex-wrap gap-4 justify-center">
              <button onClick={() => d({ type: 'reset' })} className="px-8 py-3 font-display font-bold tracking-[.3em] uppercase text-black bg-cyan-neon shadow-[0_0_30px_rgb(var(--c-accent)/.7)] hover:scale-105 transition-transform">{s.stage === 'won' ? 'Again' : 'Retry'}</button>
              <button onClick={onExit} className="px-8 py-3 font-display font-bold tracking-[.3em] uppercase text-white border border-white/50 hover:bg-white/10 transition-colors">Return to Codex</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// The active-state check: in Sukuna mode the Gojo fight is bypassed entirely and the Sukuna pattern runs instead.
function Arena(props) {
  return document.body.classList.contains('sukuna-mode') ? <SukunaArena {...props} /> : <GojoArena {...props} />;
}

function Footer() {
  return <footer className="text-center py-12 px-5 font-display text-[11px] tracking-[.4em] uppercase text-white/50">Made by Porsche</footer>;
}

function App() {
  const [intro, setIntro] = useState(!REDUCED);
  const [shown, setShown] = useState(REDUCED);
  const [event, setEvent] = useState('idle'); // idle → hollow → arena
  const [arenaUp, setArenaUp] = useState(false);
  const [at, setAt] = useState({ x: 0, y: 0 });
  const exitArena = () => { setArenaUp(false); setEvent('idle'); };
  return (
    <>
      <div className="bg-fixed" aria-hidden="true" />
      <div className="swirl swirl-a" aria-hidden="true" />
      <VoidBackground paused={arenaUp || event === 'hollow'} />
      <div className="vignette" aria-hidden="true" />
      <div id="page" className="reveal relative z-10" style={{ opacity: shown ? 1 : 0, display: arenaUp ? 'none' : undefined }}>
        <Header />
        <main><Hero /><EyesSection /><LimitlessSection /><DomainSection /></main>
        <Footer />
      </div>
      {shown && event === 'idle' && <HiddenOrbs onCollide={(pt) => { setAt(pt); setEvent('hollow'); }} />}
      {arenaUp && <Arena onExit={exitArena} />}
      {event === 'hollow' && <HollowSequence at={at} onArena={() => setArenaUp(true)} onEnd={() => setEvent('arena')} />}
      {intro && <Intro onReveal={() => setShown(true)} onDone={() => setIntro(false)} />}
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
